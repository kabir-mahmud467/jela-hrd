<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRD Narayanganj</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <span class="logo">এইচআরডি নারায়ণগঞ্জ জেলা</span>
    <button id="themeBtn" class="icon-btn" title="ডার্ক / লাইট থিম">থিম</button>
    <button id="refreshBtn" class="icon-btn" title="নতুন কন্টেন্ট আনুন">⟳</button>
  </div>
  <div id="syncLine" class="sync">লোড হচ্ছে…</div>
  <div id="updateBar" class="update-bar" style="display:none">
    <span id="updateText">নতুন আপডেট এসেছে।</span>
    <button id="updateBtn" class="btn small">এখনই আপডেট করুন</button>
  </div>
  <nav id="tabs" class="tabs"></nav>
</header>
<main id="view" class="wrap"></main>
<script src="app.js"></script>
</body>
</html>
