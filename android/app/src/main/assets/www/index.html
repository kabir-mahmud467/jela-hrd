<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f7fb">
<title>HRD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <span class="logo">এইচআরডি</span>
    <button id="themeBtn" class="icon-btn" title="ডার্ক / লাইট থিম" aria-label="ডার্ক থিম চালু করুন"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    <button id="refreshBtn" class="icon-btn" title="নতুন কন্টেন্ট আনুন">⟳</button>
  </div>
  <div id="syncLine" class="sync">লোড হচ্ছে…</div>
  <div id="updateBar" class="update-bar" style="display:none">
    <span id="updateText">নতুন আপডেট এসেছে।</span>
    <button id="updateBtn" class="btn small">এখনই আপডেট করুন</button>
  </div>
  <nav id="tabs" class="tabs"></nav>
</header>
<main id="view" class="wrap"></main>
<script src="app.js"></script>
</body>
</html>
