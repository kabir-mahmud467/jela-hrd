plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jelahrd.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jelahrd.app'
        minSdk 23
        targetSdk 34
        versionCode 10
        versionName '1.9'
    }

    def keyProps = new Properties()
    def keyFile = new File(System.getProperty("user.home"), ".gradle/hrd-signing.properties")
    if (keyFile.exists()) keyProps.load(new FileInputStream(keyFile))

    signingConfigs {
        release {
            storeFile file("../hrd-release.jks")
            storePassword keyProps.getProperty("storePassword", System.getenv("HRD_STORE_PASSWORD"))
            keyAlias keyProps.getProperty("keyAlias", "hrd")
            keyPassword keyProps.getProperty("keyPassword", System.getenv("HRD_KEY_PASSWORD"))
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
