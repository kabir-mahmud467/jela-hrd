plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jelahrd.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jelahrd.app'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
