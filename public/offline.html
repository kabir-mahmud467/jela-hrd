<style>

  }
  .card {
    background: #fff; border-radius: 15px; padding: 32px 28px; max-width: 420px;
    width: 100%; text-align: center; box-shadow: 0 4px 20px rgba(10,44,72,.12);
  }
  h1 { font-size: 22px; margin: 12px 0 8px; }
  p { color: #54687d; font-size: 16px; margin-bottom: 20px; }
  a.btn {
    display: inline-block; background: #114575; color: #fff; text-decoration: none;
    padding: 12px 28px; border-radius: 12px; font-size: 16px; font-weight: 600;
  }
  a.btn:focus { outline: rgb(0,179,241) 0 0 0 2px; }
</style>

  <div class="card">
    <svg width="72" height="72" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3.2l1.5 3 3.3.5-2.4 2.3.6 3.3-3-1.6-3 1.6.6-3.3-2.4-2.3 3.3-.5z" fill="#e93e3f"/><path d="M7 16.5c4-2.2 8-2.2 13 0 5-2.2 9-2.2 13 0V30c-4-2.2-8-2.2-13 0-5-2.2-9-2.2-13 0z" fill="#114575"/><path d="M20 16.5V30" stroke="#fff" stroke-width="1.6"/></svg>
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>সংযোগ ফিরে এলে আবার চেষ্টা করুন। আগের দেখা পেজগুলো অফলাইনেও খুলতে পারে।</p>
    <a class="btn" href="/">আবার চেষ্টা করুন</a>
  </div>
